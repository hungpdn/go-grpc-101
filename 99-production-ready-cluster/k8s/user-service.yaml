apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: user-service
        image: user-service:latest
        imagePullPolicy: Never
        ports:
        - name: grpc
          containerPort: 50069
        - name: metrics
          containerPort: 8082
        env:
        # Runtime Tuning: Force GC to clean up memory before hitting K8s RAM limit
        - name: GOMEMLIMIT
          value: "115MiB"
        - name: GOGC
          value: "100"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "jaeger.monitoring:4317"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
  - name: grpc
    port: 50069
    targetPort: 50069
  - name: metrics
    port: 8082
    targetPort: 8082
  selector:
    app: user-service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service-monitor
  labels:
    release: prom
spec:
  selector:
    matchLabels:
      app: user-service
  endpoints:
  - port: metrics
    path: /metrics
    interval: 10s
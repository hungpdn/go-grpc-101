apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:latest
        imagePullPolicy: Never
        ports:
        - name: grpc
          containerPort: 50069
        env:
        - name: GOMEMLIMIT
          value: "115MiB"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
  - name: grpc
    port: 50069
    targetPort: 50069
  selector:
    app: user-service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service-monitor
  labels:
    release: prom
spec:
  selector:
    matchLabels:
      app: user-service
  endpoints:
  - port: grpc
    path: /metrics
    interval: 10s
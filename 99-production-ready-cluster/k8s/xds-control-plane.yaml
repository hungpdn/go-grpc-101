apiVersion: apps/v1
kind: Deployment
metadata:
  name: xds-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xds-control-plane
  template:
    metadata:
      labels:
        app: xds-control-plane
    spec:
      serviceAccountName: xds-control-plane-sa
      containers:
      - name: xds-control-plane
        image: xds-controlplane:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 15010
---
apiVersion: v1
kind: Service
metadata:
  name: xds-control-plane
spec:
  ports:
  - port: 15010
    targetPort: 15010
  selector:
    app: xds-control-plane
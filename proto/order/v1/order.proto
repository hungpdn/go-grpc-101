syntax = "proto3";

package order.v1;

option go_package = "github.com/hungpdn/go-grpc-101/pb/order/v1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}

message CreateOrderRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CreateOrderResponse {
  string order_id = 1;
}
